version: '3.8'

services:
  db-service:
    image: postgres:16
    container_name: postgres_db_container
    restart: always
    environment:
      POSTGRES_DB: hairsalon_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: $"{PASSWORD_POSGRES}" 
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hairsalon_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hair_salon_bot_container
    restart: always
    ports:
      - "5041:5041"
    depends_on:
      db-service:
        condition: service_healthy

volumes:
  pgdata: